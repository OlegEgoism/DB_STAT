<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">How DB STAT works</title><desc id="desc">Application data is separated from monitored DBMS data</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect width="1500" height="940" rx="24" fill="#ffffff"/>
<text x="750" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a"><tspan x="750" dy="0">How DB STAT works</tspan></text><text x="750" y="91" text-anchor="middle" font-size="19" font-weight="400" fill="#64748b"><tspan x="750" dy="0">Application data is separated from monitored DBMS data</tspan></text>
<g filter="url(#shadow)"><g><rect x="45" y="335" width="300" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="195.0" y="377" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb"><tspan x="195.0" dy="0">User and browser</tspan></text><text x="195.0" y="415" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="195.0" dy="0">Sign in</tspan><tspan x="195.0" dy="27">Select connection and dashboard</tspan><tspan x="195.0" dy="27">HTML interface and JSON</tspan></text></g><g><rect x="435" y="315" width="330" height="230" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="600.0" y="357" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3aed"><tspan x="600.0" dy="0">Django application</tspan></text><text x="600.0" y="395" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="600.0" dy="0">Request routing</tspan><tspan x="600.0" dy="27">Session, role, access checks</tspan><tspan x="600.0" dy="27">Safe response generation</tspan></text></g><g><rect x="855" y="120" width="300" height="190" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/><text x="1005.0" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#d97706"><tspan x="1005.0" dy="0">Internal SQLite</tspan></text><text x="1005.0" y="200" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="1005.0" dy="0">Users and sessions</tspan><tspan x="1005.0" dy="27">Encrypted connections</tspan><tspan x="1005.0" dy="27">Preferences, favorites, audit</tspan></text></g><g><rect x="855" y="370" width="300" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="1005.0" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb"><tspan x="1005.0" dy="0">psycopg2 pool</tspan></text><text x="1005.0" y="450" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="1005.0" dy="0">Connection reuse</tspan><tspan x="1005.0" dy="27">Parameterized SQL queries</tspan><tspan x="1005.0" dy="27">Return connection to pool</tspan></text></g><g><rect x="855" y="650" width="300" height="180" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="1005.0" y="692" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3aed"><tspan x="1005.0" dy="0">Background jobs</tspan></text><text x="1005.0" y="730" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="1005.0" dy="0">VACUUM / ANALYZE</tspan><tspan x="1005.0" dy="27">EXPLAIN ANALYZE</tspan><tspan x="1005.0" dy="27">Status and result in SQLite</tspan></text></g><g><rect x="1220" y="370" width="240" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="1340.0" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#059669"><tspan x="1340.0" dy="0">Target DBMS</tspan></text><text x="1340.0" y="450" text-anchor="middle" font-size="19" font-weight="400" fill="#0f172a"><tspan x="1340.0" dy="0">PostgreSQL</tspan><tspan x="1340.0" dy="27">Greenplum / Greengage</tspan><tspan x="1340.0" dy="27">Catalogs and statistics</tspan></text></g></g><g><path d="M 345 405 L 435 405" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="275.0" y="355" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="390.0" y="376" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="390.0" dy="0">1. HTTP(S) request</tspan></text></g><g><path d="M 435 480 L 345 480" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="275.0" y="494" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="390.0" y="515" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="390.0" dy="0">6. HTML / JSON</tspan></text></g><g><path d="M 765 350 L 855 260" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="265" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="810.0" y="286" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="810.0" dy="0">2. ORM: session and access</tspan></text></g><g><path d="M 765 430 L 855 430" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="378" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="810.0" y="399" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="810.0" dy="0">3. Borrow connection</tspan></text></g><g><path d="M 1155 430 L 1220 430" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1072.5" y="378" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="1187.5" y="399" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="1187.5" dy="0">4. Query system data</tspan></text></g><g><path d="M 1220 510 L 1155 510" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1072.5" y="524" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="1187.5" y="545" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="1187.5" dy="0">5. Result rows</tspan></text></g><g><path d="M 690 545 L 855 700" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="657.5" y="589" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="772.5" y="610" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="772.5" dy="0">Management operation</tspan></text></g><g><path d="M 1155 740 L 1340 560" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="1132.5" y="604" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="1247.5" y="625" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="1247.5" dy="0">VACUUM / ANALYZE</tspan></text></g><g><path d="M 1005 650 L 1005 310" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="890.0" y="579" width="230" height="29" rx="8" fill="#ffffff" opacity="0.94"/><text x="1005.0" y="600" text-anchor="middle" font-size="16" font-weight="400" fill="#334155"><tspan x="1005.0" dy="0">Status and audit</tspan></text></g><g><rect x="70" y="680" width="650" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="722" text-anchor="start" font-size="18" font-weight="400" fill="#334155"><tspan x="100" dy="0">✓  No session: HTTP 401</tspan><tspan x="100" dy="35">✓  No access: HTTP 403/404</tspan><tspan x="100" dy="35">✓  Database errors: safe client message; details stay in the server log</tspan></text></g>
<rect x="250" y="875" width="1000" height="38" rx="12" fill="#f1f5f9"/><text x="750" y="901" text-anchor="middle" font-size="17" font-weight="400" fill="#64748b"><tspan x="750" dy="0">Solid line — primary request    Dashed line — background management operation</tspan></text></svg>