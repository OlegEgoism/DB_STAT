{% load static i18n versioned_static %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ru' }}" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DB STAT{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

    <!-- Apply the saved palette before styles are painted to avoid a theme flash. -->
    <script src="{% static_versioned 'js/theme.js' %}"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{% static_versioned 'css/home.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}

<!-- ========== SCRIPTS ========== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block i18n_scripts %}
<script>window.DB_STAT_LANGUAGE = "{{ LANGUAGE_CODE|default:'ru'|escapejs }}";</script>
<script src="{% static_versioned 'js/i18n.js' %}"></script>
{% endblock %}
{% block extra_scripts %}{% endblock %}
</body>
</html>
