name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Without this, `manage.py check`/`test` would run against the insecure
      # default SECRET_KEY and trip db_statistics.checks' W002 warning — this
      # is a throwaway CI-only value, not a production secret.
      SECRET_KEY: ci-only-secret-key-not-used-in-production
    # Интеграционные тесты (db_statistics/tests/test_integration_*.py) работают с
    # настоящим PostgreSQL. Пароль ниже — одноразовый, только для CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pg-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # psycopg2 (non-binary, see requirements.txt) compiles a C extension
      # against libpq at install time — mirrors the Dockerfile builder stage.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc libpq-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Django system checks
        run: python manage.py check

      # Статика (static/js/*.js) не проходит через Django-тесты, поэтому синтаксис проверяем
      # отдельно: tree-sitter разбирает файлы и падает на любом узле ERROR/MISSING.
      - name: JS syntax check (tree-sitter)
        run: |
          pip install tree-sitter tree-sitter-javascript
          python scripts/check_js.py

      - name: Run tests
        env:
          # Без PG_TEST_HOST интеграционные тесты пропускаются молча, поэтому в CI они заданы явно.
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PORT: 5432
          PG_TEST_USER: postgres
          PG_TEST_PASSWORD: ci-pg-password
          PG_TEST_DATABASE: postgres
        run: python manage.py test -v 2

      # Политика решения владельца проекта: найденные уязвимости зависимостей пока
      # только выводятся в журнал и не останавливают сборку. Блокировать сборку
      # можно, убрав continue-on-error, когда определено, что делать с находками.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
